org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
kotlin.code.style=official
# Instrumented tests: each module's test task boots its own emulator, and two at once already run a CI runner out of
# memory (exit code 143). One emulator at a time, while everything else still builds in parallel.
android.experimental.testOptions.managedDevices.maxConcurrentDevices=1

# Roborazzi: compare against the recorded images by default (CI). Record with -Proborazzi.test.record=true.
roborazzi.test.verify=true
