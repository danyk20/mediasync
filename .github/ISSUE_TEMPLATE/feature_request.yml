name: Feature request
description: Suggest an improvement or a new connector
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like MediaSync to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
