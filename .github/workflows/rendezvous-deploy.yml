name: Rendezvous deploy

# Deploys the Cloudflare Worker in infra/rendezvous into the developer's Cloudflare account (docs/PLAN.md §8.4,
# §10.4, §14.2):
# - staging, for testing: on every push to main that changes it, or by hand;
# - wake-relay, by hand: the developer's wake relay, which sends households' wake-ups through FCM with the app's
#   service account (FCM_SERVICE_ACCOUNT in the `rendezvous-wake-relay` environment).
# Households run their own Worker, which the receiving phone deploys into their own account (bring your own
# Cloudflare), so there's no production Worker here. Until an environment `rendezvous-<target>` holds
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, the job skips the deploy with a notice. See
# infra/rendezvous/README.md.

on:
  push:
    branches: [main]
    paths:
      - infra/rendezvous/**
      - .github/workflows/rendezvous-deploy.yml
  workflow_dispatch:
    inputs:
      target:
        description: Which Worker
        type: choice
        options: [staging, wake-relay]
        default: staging

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy (${{ inputs.target || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: rendezvous-${{ inputs.target || 'staging' }}
    concurrency:
      group: rendezvous-deploy-${{ inputs.target || 'staging' }}
      cancel-in-progress: false
    env:
      TARGET: ${{ inputs.target || 'staging' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - name: Check the target and the Cloudflare credentials
        id: credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare credentials in the rendezvous-$TARGET environment; skipping the deploy (infra/rendezvous/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/rendezvous/package-lock.json
      - if: steps.credentials.outputs.ready == 'true'
        name: Install the exact versions from package-lock.json
        working-directory: infra/rendezvous
        run: npm ci
      # Deploys the Worker, its Durable Object migrations and the cron trigger. The Worker's own secrets
      # (TURN key, analytics token, FCM service account) are set once with `wrangler secret put`.
      - if: steps.credentials.outputs.ready == 'true'
        name: Deploy
        working-directory: infra/rendezvous
        run: npx wrangler deploy --env "$TARGET"
      # The wake relay's only secret, from its GitHub environment; never in the repository or the logs.
      - if: steps.credentials.outputs.ready == 'true' && env.TARGET == 'wake-relay'
        name: Set the FCM service account
        working-directory: infra/rendezvous
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FCM_SERVICE_ACCOUNT" ]; then
            echo "::error::No FCM_SERVICE_ACCOUNT in the rendezvous-wake-relay environment (infra/rendezvous/README.md)."
            exit 1
          fi
          printf '%s' "$FCM_SERVICE_ACCOUNT" | npx wrangler secret put FCM_SERVICE_ACCOUNT --env wake-relay
      # Deployed and given its secret: it must reach FCM now, or every household's wake-ups fail (PLAN §10.4).
      - if: steps.credentials.outputs.ready == 'true' && env.TARGET == 'wake-relay'
        name: Check the wake relay reaches FCM
        working-directory: infra/rendezvous
        run: scripts/check-wake-relay.sh
