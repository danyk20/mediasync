name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  static-checks:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Formatting, detekt, Android Lint, dependency licenses
        run: ./gradlew spotlessCheck detekt lintDebug licenseeDebug --continue
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-check-reports
          path: |
            **/build/reports/detekt/
            **/build/reports/lint-results-*.html
            **/build/reports/licensee/
          if-no-files-found: ignore

  unit-tests:
    name: Unit & screenshot tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The Kover tasks run every module's unit tests once (debug variant on Android), including screenshot
      # verification, and then check the coverage gates: 70 % overall, 85 % for sync and transport modules.
      - name: Tests, screenshot verification and coverage gates
        run: ./gradlew koverXmlReportCi koverVerifyCi --continue
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          path = "build/reports/kover/reportCi.xml"
          if not os.path.exists(path):
              print("Coverage report not generated."); raise SystemExit
          root = ET.parse(path).getroot()
          print("### Line coverage\n\n| Package | Coverage |\n|---|---|")
          for pkg in sorted(root.findall("package"), key=lambda p: p.get("name")):
              for c in pkg.findall("counter"):
                  if c.get("type") == "LINE":
                      m, cv = int(c.get("missed")), int(c.get("covered"))
                      print(f"| `{pkg.get('name')}` | {cv / (m + cv):.0%} |")
          for c in root.findall("counter"):
              if c.get("type") == "LINE":
                  m, cv = int(c.get("missed")), int(c.get("covered"))
                  print(f"| **Total** | **{cv / (m + cv):.1%}** |")
          EOF
      - name: Upload test reports and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/outputs/roborazzi/
            **/src/test/screenshots/*_compare.png
            **/src/test/screenshots/*_actual.png
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Assemble debug and (unsigned) release
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mediasync-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  instrumented-tests:
    name: Instrumented tests (API 29, 36)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM for hardware-accelerated emulators
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Every module sets up the same emulators in parallel, and two of them installing one system image at
      # once can fail ("System Image ... does not exist for this architecture"). Install them once first.
      - name: Install emulator images
        run: >
          ./gradlew :app:api29Setup :app:api36Setup --max-workers=1
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      # Each test task boots its own emulator; at most two at a time, or the runner runs out of memory and
      # systemd-oomd stops the job (exit code 143).
      - name: Run on Gradle Managed Devices
        run: >
          ./gradlew ciGroupDebugAndroidTest --max-workers=2
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-test-reports
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore
