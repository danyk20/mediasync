name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # Which parts a pull request touches: one changing only docs or the Worker skips the Android jobs (skipped jobs
  # count as passed). Everything else, workflows included, runs them all.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.filter.outputs.android }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "android=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          others=$(git diff --name-only "$BASE"...HEAD | grep -vE '^(docs/|infra/rendezvous/)|\.md$' || true)
          echo "Changes outside docs and the Worker:"
          echo "${others:-none}"
          if [ -n "$others" ]; then echo "android=true"; else echo "android=false"; fi >> "$GITHUB_OUTPUT"

  static-checks:
    name: Static checks
    needs: changes
    # Skipped only on an explicit "docs or Worker only": if the filter failed, everything runs.
    if: ${{ !cancelled() && needs.changes.outputs.android != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Formatting, detekt, Android Lint, dependency licenses
        run: ./gradlew spotlessCheck detekt lintDebug licenseeDebug --continue
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: static-check-reports
          path: |
            **/build/reports/detekt/
            **/build/reports/lint-results-*.html
            **/build/reports/licensee/
          if-no-files-found: ignore

  unit-tests:
    name: Unit & screenshot tests
    needs: changes
    # Skipped only on an explicit "docs or Worker only": if the filter failed, everything runs.
    if: ${{ !cancelled() && needs.changes.outputs.android != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Robolectric fetches Android itself (about 200 MB) from Maven Central while the tests run, outside Gradle and
      # its cache. Kept here per Robolectric version, it isn't fetched again each run, and a dropped connection can't
      # fail the tests, as it once did ("Connection reset").
      - name: Robolectric version
        id: robolectric
        run: echo "version=$(sed -n 's/^robolectric = "\(.*\)"/\1/p' gradle/libs.versions.toml)" >> "$GITHUB_OUTPUT"
      - name: Cache Robolectric's Android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ steps.robolectric.outputs.version }}
      # The Kover tasks run every module's unit tests once (debug variant on Android), including screenshot
      # verification, and then check the coverage gates: 70 % overall, 85 % for sync and transport modules.
      - name: Tests, screenshot verification and coverage gates
        run: ./gradlew koverXmlReportCi koverVerifyCi --continue
      - name: Coverage summary
        if: always()
        run: |
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import os, xml.etree.ElementTree as ET
          path = "build/reports/kover/reportCi.xml"
          if not os.path.exists(path):
              print("Coverage report not generated."); raise SystemExit
          root = ET.parse(path).getroot()
          print("### Line coverage\n\n| Package | Coverage |\n|---|---|")
          for pkg in sorted(root.findall("package"), key=lambda p: p.get("name")):
              for c in pkg.findall("counter"):
                  if c.get("type") == "LINE":
                      m, cv = int(c.get("missed")), int(c.get("covered"))
                      print(f"| `{pkg.get('name')}` | {cv / (m + cv):.0%} |")
          for c in root.findall("counter"):
              if c.get("type") == "LINE":
                  m, cv = int(c.get("missed")), int(c.get("covered"))
                  print(f"| **Total** | **{cv / (m + cv):.1%}** |")
          EOF
      - name: Upload test reports and screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/
            **/build/outputs/roborazzi/
            **/src/test/screenshots/*_compare.png
            **/src/test/screenshots/*_actual.png
          if-no-files-found: ignore

  benchmark:
    name: Throughput benchmark
    needs: changes
    # Skipped only on an explicit "docs or Worker only": if the filter failed, everything runs.
    if: ${{ !cancelled() && needs.changes.outputs.android != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # Whole sync sessions over loopback TLS and over a simulated Wi-Fi hop (docs/PLAN.md §7).
      - name: Measure sync throughput
        run: ./gradlew :transport:lan:benchmark
      # The history comes from runs on main; pull requests compare against it without changing it.
      - name: Restore earlier results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmark-history
          key: benchmark-${{ github.run_id }}
          restore-keys: benchmark-
      # Shared CI machines vary a lot: only a halving fails the check.
      - name: Compare with earlier results
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc # v1.22.2
        with:
          name: Sync throughput
          tool: customBiggerIsBetter
          output-file-path: transport/lan/build/benchmark/results.json
          external-data-json-path: benchmark-history/data.json
          alert-threshold: 200%
          fail-on-alert: true
          summary-always: true
      - name: Keep the results of main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: benchmark-history
          key: benchmark-${{ github.run_id }}

  build:
    name: Build
    needs: changes
    # Skipped only on an explicit "docs or Worker only": if the filter failed, everything runs.
    if: ${{ !cancelled() && needs.changes.outputs.android != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Assemble debug and (unsigned) release
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      # WebRTC's native code looks these classes up by name when it loads. Without them in the release build, the
      # first internet connection aborts the app (0.8.2 on real phones): R8 must keep them, unrenamed.
      - name: Check the release build keeps WebRTC's JNI classes
        run: |
          mapping=app/build/outputs/mapping/release/mapping.txt
          for class in org.jni_zero.JniZero org.webrtc.WebRtcClassLoader org.webrtc.PeerConnectionFactory; do
            if ! grep -q "^$class -> $class:" "$mapping"; then
              echo "::error::$class is missing or renamed in the release build (transport/webrtc/consumer-rules.pro)"
              exit 1
            fi
          done
      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mediasync-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  rendezvous:
    name: Rendezvous Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: infra/rendezvous
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/rendezvous/package-lock.json
      - name: Install the exact versions from package-lock.json
        run: npm ci
      - name: License headers
        run: npm run check:headers
      - name: Binding types match wrangler.toml
        run: npm run check:types
      - name: Type check
        run: npm run typecheck
      # Vitest runs inside the Workers runtime (workerd); outbound calls to Cloudflare and Google are mocked.
      - name: Tests
        run: npm test
      - name: Bundle as for deployment (dry run, no Cloudflare account needed)
        run: npm run bundle
      # The app carries the Worker, to deploy it into the user's own Cloudflare account (PLAN §8.4): its copy must be
      # what this source builds. The bundle is reproducible.
      - name: The app's copy of the Worker is current
        run: |
          npm run bundle:app
          changed=$(git status --porcelain -- ../../sync/android/src/main/assets/rendezvous)
          if [ -n "$changed" ]; then
            echo "::error::The app's copy of the Worker is out of date: run 'npm run bundle:app' in infra/rendezvous and commit it."
            echo "$changed"
            exit 1
          fi

  # One job per API level, side by side on their own runners. Branch protection requires the summary's name.
  instrumented-tests:
    name: Instrumented tests (API ${{ matrix.api }})
    needs: changes
    # Skipped only on an explicit "docs or Worker only": if the filter failed, everything runs.
    if: ${{ !cancelled() && needs.changes.outputs.android != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Enable KVM for hardware-accelerated emulators
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Downloaded each time: caching an image (1–2 GB) would push the Gradle caches out of the repository's 10 GB.
      - name: Install the emulator image
        run: scripts/install-emulator-image.sh ${{ matrix.api }}
      # A run was once stopped from outside (exit code 143, every later step skipped) while four emulators were
      # alive: each test task boots its own, and they keep running for a while after it ends. Two API 36 emulators
      # at once already run a runner out of memory (nightly), so gradle.properties allows one at a time. Memory,
      # disk and emulators are logged.
      - name: Record memory and disk while testing
        run: |
          nohup bash -c 'while true; do
            echo "$(date -u +%T) $(free -m | awk "/^Mem:/ {print \"used=\" \$3 \"MB available=\" \$7 \"MB\"}") disk_free=$(df -m / | awk "NR==2 {print \$4}")MB emulators=$(pgrep -c qemu-system || true)"
            sleep 10
          done' > memory.log 2>&1 &
      - name: Run on API ${{ matrix.api }}
        id: device-tests
        run: >
          ./gradlew api${{ matrix.api }}DebugAndroidTest
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      # always(): when the runner is stopped from outside, failure() steps are skipped.
      - name: Show why the tests stopped
        if: always() && steps.device-tests.outcome != 'success'
        run: |
          tail -n 40 memory.log || true
          sudo dmesg -T | grep -iE 'out of memory|oom|killed process' || echo "No kernel out-of-memory messages."
          journalctl -u systemd-oomd --no-pager 2>/dev/null | tail -n 20 || true
      - name: Upload reports
        if: always() && steps.device-tests.outcome != 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-test-reports-api${{ matrix.api }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
            memory.log
          if-no-files-found: ignore

  instrumented-tests-summary:
    name: Instrumented tests (API 29, 36)
    needs: instrumented-tests
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Skipped when the pull request changes only docs or the Worker.
      - name: Every API level passed
        run: |
          result="${{ needs.instrumented-tests.result }}"
          echo "Instrumented tests: $result"
          test "$result" = success || test "$result" = skipped
