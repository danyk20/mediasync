name: CodeQL

on:
  push:
    branches: [main]
  # Not for a pull request that changes only docs: nothing CodeQL reads.
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "41 4 * * 1"

# A newer push to a pull request makes its running analysis pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
          # The rendezvous Worker (infra/rendezvous).
          - language: javascript-typescript
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: matrix.build-mode == 'manual'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
      - if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # Compiles everything the app is built from (Kotlin, Java, KSP and Hilt: the same compile tasks as
      # :app:assembleDebug) without dexing or packaging it, which CodeQL doesn't read.
      - if: matrix.build-mode == 'manual'
        name: Build (CodeQL observes the compiler)
        run: >
          ./gradlew :app:compileDebugJavaWithJavac :app:hiltJavaCompileDebug
          --no-build-cache --no-configuration-cache --rerun-tasks
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
