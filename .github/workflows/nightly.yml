name: Nightly

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # One job per API level, each on its own runner: four emulator types booting on one runner exhausted it
  # (nightly #1: "The runner has received a shutdown signal").
  device-matrix:
    name: Instrumented tests (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api: [29, 31, 34, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Enable KVM for hardware-accelerated emulators
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the emulator image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANDROID_HOME }}/system-images/android-${{ matrix.api }}
          key: emulator-image-api${{ matrix.api }}-${{ runner.os }}-${{ hashFiles('build-logic/convention/src/main/kotlin/io/github/danyk20/mediasync/buildlogic/KotlinAndroid.kt') }}
      # Every module sets up the same emulator in parallel, and two of them installing one system image at
      # once can fail ("System Image ... does not exist for this architecture"). Install it once first.
      - name: Install the emulator image
        run: >
          ./gradlew :app:api${{ matrix.api }}Setup --max-workers=1
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      # Each test task boots its own emulator; one at a time, or the runner runs out of memory and systemd-oomd
      # stops the job (exit code 143): two API 36 emulators already do.
      - name: Run on API ${{ matrix.api }}
        run: >
          ./gradlew api${{ matrix.api }}DebugAndroidTest --max-workers=1
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-instrumented-reports-api${{ matrix.api }}
          path: |
            **/build/reports/androidTests/
            **/build/outputs/androidTest-results/
          if-no-files-found: ignore
