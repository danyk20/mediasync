name: Release

on:
  push:
    branches: [main]
  # Builds and attaches the files again for a release that already exists, e.g. after this workflow failed.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build, e.g. v0.2.0
        required: true
        type: string
      # A test run: only the desktop installers are built, and they are kept as workflow artifacts, not attached to
      # the release. Untick it to build everything again for the release (the Android files too).
      dry_run:
        description: Dry run, build the desktop installers only and keep them as workflow artifacts
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A personal access token lets CI run on the release PR (docs/RELEASING.md); falls back to GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Build, sign and attach artifacts
    needs: release-please
    # !cancelled(): when built by hand, release-please is skipped. Not in a dry run (it attaches files to the release).
    if: ${{ !cancelled() && !inputs.dry_run && (inputs.tag != '' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.MEDIASYNC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Release signing secrets are missing from the 'release' environment. See docs/RELEASING.md."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MEDIASYNC_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build signed APK and App Bundle
        env:
          MEDIASYNC_KEYSTORE_PASSWORD: ${{ secrets.MEDIASYNC_KEYSTORE_PASSWORD }}
          MEDIASYNC_KEY_ALIAS: ${{ secrets.MEDIASYNC_KEY_ALIAS }}
          MEDIASYNC_KEY_PASSWORD: ${{ secrets.MEDIASYNC_KEY_PASSWORD }}
          # Sign in with Cloudflare (infra/rendezvous/README.md): without these repository variables, the app takes a
          # pasted token only.
          CLOUDFLARE_OAUTH_CLIENT_ID: ${{ vars.CLOUDFLARE_OAUTH_CLIENT_ID }}
          CLOUDFLARE_OAUTH_REDIRECT_URI: ${{ vars.CLOUDFLARE_OAUTH_REDIRECT_URI }}
        # Two builds: with resource shrinking, the Android Gradle Plugin can't build the App Bundle while the
        # per-CPU APKs are on (https://issuetracker.google.com/402800800). v0.2.0's first build failed on it.
        run: |
          scripts/gradlew-retrying.sh :app:bundleRelease
          scripts/gradlew-retrying.sh :app:assembleRelease -Pmediasync.abiSplits
      - name: Collect artifacts and checksums
        run: |
          mkdir dist
          # The universal APK runs on every phone; the others hold one CPU's native code only, so they're smaller.
          cp app/build/outputs/apk/release/app-universal-release.apk "dist/mediasync-$TAG.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/outputs/apk/release/app-$abi-release.apk" "dist/mediasync-$TAG-$abi.apk"
          done
          cp app/build/outputs/bundle/release/app-release.aab "dist/mediasync-$TAG.aab"
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/mediasync-*
      - name: Attach to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
      # Optional: with a Play service account key in the 'release' environment, the App Bundle also goes to a
      # Google Play testing track (docs/play/README.md §7). Without the key, the upload is skipped.
      - name: Check for a Google Play key
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "No PLAY_SERVICE_ACCOUNT_JSON in the 'release' environment: not uploading to Google Play."
          fi
      - name: Upload to Google Play
        if: steps.play.outputs.upload == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.danyk20.mediasync
          releaseFiles: dist/mediasync-${{ env.TAG }}.aab
          # Repository variables; Play accepts only drafts until the app's first release has passed review.
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
          # Lets Play show readable stack traces for crashes.
          mappingFile: app/build/outputs/mapping/release/mapping.txt
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  # The desktop installers (docs/desktop.md). Unsigned: no Apple or Windows certificates (the macOS app is ad-hoc signed,
  # which Apple Silicon requires). Needs no secrets, so no approval: the release itself was approved when its pull
  # request was merged.
  desktop:
    name: Desktop installer (${{ matrix.name }})
    needs: release-please
    if: ${{ !cancelled() && (inputs.tag != '' || needs.release-please.outputs.release_created == 'true') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macos-arm64
            tasks: :desktopApp:packageDmg
          # Intel Macs. macos-latest is Apple Silicon, so this is a separate build on the Intel image.
          # If macos-15-intel is ever retired, use macos-13 (the same Intel hardware, an older image).
          - os: macos-15-intel
            name: macos-x64
            tasks: :desktopApp:packageDmg
          - os: windows-latest
            name: windows-x64
            tasks: :desktopApp:packageMsi
          - os: ubuntu-latest
            name: linux-x64
            tasks: :desktopApp:packageDeb :desktopApp:packageRpm
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
      # jpackage builds .rpm with rpmbuild and .deb with fakeroot.
      - name: Install the Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm fakeroot
      # jpackage builds .msi with the WiX Toolset 3; the runner image normally has it.
      - name: Check for the WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
            $wix = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset*\bin" | Select-Object -First 1
            $wix.FullName | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          }
      - name: Build the installer
        shell: bash
        run: scripts/gradlew-retrying.sh ${{ matrix.tasks }}
      # On Apple silicon the app must carry at least an ad-hoc signature, or macOS refuses to start it at all (the
      # build adds one there). Intel Macs start an unsigned app the same way ("Open Anyway"), and the Intel build
      # doesn't sign it, so the check is for Apple silicon only.
      - name: Check the macOS app is signed (ad hoc)
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        run: |
          app=desktopApp/build/compose/binaries/main/app/MediaSync.app
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -q 'Signature=adhoc'
      # Finder must open the DMG with no prompt: an embedded license agreement makes current macOS call it
      # "corrupted". Mounting it without input (stdin closed) fails if anything asks.
      - name: Check the DMG opens without a prompt
        if: runner.os == 'macOS'
        run: |
          dmg=$(find desktopApp/build/compose/binaries -name '*.dmg' | head -n 1)
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -noautoopen -mountpoint "$mnt" "$dmg" < /dev/null
          test -d "$mnt/MediaSync.app"
          hdiutil detach "$mnt"
      - name: Collect installers and checksums
        shell: bash
        run: |
          # The real version from version.txt. The macOS package version is 1.x.y for 0.x.y (docs/desktop.md).
          version=$(tr -d '[:space:]' < version.txt)
          mkdir dist
          while IFS= read -r file; do
            ext="${file##*.}"
            label="${{ matrix.name }}"
            # Debian and Fedora name the architecture differently.
            case "$ext" in
              deb) label=linux-amd64 ;;
              rpm) label=linux-x86_64 ;;
            esac
            cp "$file" "dist/MediaSync-$version-$label.$ext"
          done < <(find desktopApp/build/compose/binaries -type f \( -name '*.dmg' -o -name '*.msi' -o -name '*.deb' -o -name '*.rpm' \))
          cd dist
          if command -v sha256sum > /dev/null; then sha256sum MediaSync-* > "SHA256SUMS-desktop-${{ matrix.name }}"; else shasum -a 256 MediaSync-* > "SHA256SUMS-desktop-${{ matrix.name }}"; fi
          cat "SHA256SUMS-desktop-${{ matrix.name }}"
          ls -l
      - name: Attest build provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/MediaSync-*
      - name: Attach to the GitHub Release
        if: ${{ !inputs.dry_run }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber
      - name: Keep as workflow artifacts (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.name }}
          path: dist/*
          retention-days: 7
