# Dependabot's PRs merge by themselves once every required check passed on the updated dependencies
# (docs/RELEASING.md). No person needs to approve them; branch protection still decides.
#
# Not run by Dependabot's own events: those can't read the repository's secrets, and anything done with
# GITHUB_TOKEN wouldn't start CI or release-please. So it looks every half hour, and after each push to main, with
# the token release-please uses. For each open Dependabot PR:
#   - auto-merge (squash) is switched on: GitHub merges it as soon as all required checks pass;
#   - one behind main (another merged first) is brought up to date, so CI runs again on it.
# A PR with a failed check or a conflict is left alone: it never merges until that's fixed (Dependabot rebases
# conflicts by itself; a failed check needs a person).
name: Dependabot merge

on:
  schedule:
    - cron: "*/30 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Auto-merge Dependabot's PRs
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASE_PLEASE_TOKEN isn't set: Dependabot's PRs aren't merged automatically."
            exit 0
          fi
          # The numbers first, then one PR at a time. (A `gh` call inside a `while read` loop reads the loop's
          # input too: the old version only ever saw the first PR.)
          numbers=$(gh pr list --author "app/dependabot" --state open --json number --jq '.[].number')
          for number in $numbers; do
            info=$(gh pr view "$number" --json title,mergeStateStatus,autoMergeRequest \
              --jq '"\(.mergeStateStatus)\t\(.autoMergeRequest != null)\t\(.title)"' < /dev/null)
            IFS=$'\t' read -r state auto title <<< "$info"
            echo "#$number $title: $state (auto-merge: $auto)"
            if [ "$auto" != true ]; then
              gh pr merge "$number" --squash --auto < /dev/null || echo "::warning::#$number: couldn't switch on auto-merge"
            fi
            case "$state" in
              BEHIND)
                gh pr update-branch "$number" < /dev/null || echo "::warning::#$number: couldn't update the branch"
                ;;
              *)
                # CLEAN merges by itself now; BLOCKED waits for checks (or a fix); DIRTY waits for Dependabot's rebase.
                ;;
            esac
          done
