[versions]
# Build
agp = "9.4.1"
kotlin = "2.4.21"
ksp = "2.3.12"

# Android SDK levels
compileSdk = "37"
targetSdk = "36"
minSdk = "29"

# AndroidX / Compose
activityCompose = "1.13.0"
composeBom = "2026.09.00"
coreKtx = "1.19.1"
datastore = "1.2.1"
hiltLifecycleViewmodelCompose = "1.4.0"
lifecycle = "2.11.0"
navigation3 = "1.2.0"
room = "2.8.5"
work = "2.12.0"
androidxHilt = "1.4.0"
camerax = "1.6.2"
exifinterface = "1.4.2"

# Libraries
coroutines = "1.11.0"
hilt = "2.60.1"
metadataExtractor = "2.21.0"
okio = "3.18.2"
serialization = "1.11.0"
zxing = "3.5.4"

# Testing
